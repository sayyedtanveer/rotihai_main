    <!-- Version check - forces hard refresh when app is updated -->
    <script>
      // Dynamic version based on build manifest or current timestamp
      // In development: uses incremental ID (won't trigger reloads)
      // In production: Service Worker handles cache busting
      const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      
      if (!isDevelopment) {
        // Production: Use Service Worker for cache management
        // Load dynamic version from meta tag if available, otherwise use SW timestamp
        const VERSION_KEY = 'app_build_version';
        
        // Get version from build (if using Vite, this would be from env)
        // For now, let Service Worker handle updates
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'CACHE_UPDATED') {
              console.log('🔄 New cache version detected, reloading...');
              window.location.reload();
            }
          });
        }
      }
    </script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('✅ Service Worker registered successfully:', registration);
              
              // Check for updates periodically (every 1 hour)
              setInterval(() => {
                registration.update();
              }, 60 * 60 * 1000);
            })
            .catch(error => {
              console.log('❌ Service Worker registration failed:', error);
            });
          
          // Listen for controller change (new SW activated)
          navigator.serviceWorker.oncontrollerchange = () => {
            console.log('🔄 Service Worker updated, reloading page...');
            window.location.reload();
          };
        });
        
        // Install prompt handling
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          console.log('💾 App can be installed');
        });
        
        // Listen for app installed
        window.addEventListener('appinstalled', () => {
          console.log('✅ App was installed');
          deferredPrompt = null;
        });
      }
    </script>
